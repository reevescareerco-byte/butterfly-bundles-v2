<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Resume Section Planner</title>
<style>
body{font-family:Arial,sans-serif;color:#281a16;margin:40px;line-height:1.5}
h1{color:#2f7158}
h2{margin-top:24px;border-bottom:2px solid #d3aa4d;padding-bottom:5px}
.box{border:1px solid #aaa;min-height:80px;padding:10px;margin:8px 0 16px}
.small{min-height:45px}
@media print{body{margin:20px}}
</style>
</head>
<body>
<h1>Resume Section Planner</h1>
<p>Decide what your resume needs before writing the final document.</p>

<h2>Contact Information</h2>
<div class="box small"></div>

<h2>Targeted Headline</h2>
<div class="box small"></div>

<h2>Professional Summary Evidence</h2>
<div class="box"></div>

<h2>Core Competencies</h2>
<div class="box"></div>

<h2>Professional Experience Evidence</h2>
<div class="box"></div>

<h2>Education</h2>
<div class="box small"></div>

<h2>Certifications and Credentials</h2>
<div class="box small"></div>

<h2>Optional Sections That Add Value</h2>
<div class="box"></div>
</body>
</html>
